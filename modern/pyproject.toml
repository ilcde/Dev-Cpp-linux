[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devcpp-modern"
version = "0.2.0"
description = "Native Qt C/C++ workbench for Windows and Linux"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = [
  "PySide6>=6.8,<7",
  "pyte>=0.8.2,<0.9",
  "pywinpty>=2.0.14,<4; sys_platform == 'win32'",
  "ptyprocess>=0.7,<0.8; sys_platform != 'win32'",
  "pygdbmi>=0.11,<0.12",
  "pypresence>=4.3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
package = ["pyinstaller>=6,<7"]

[project.scripts]
devcpp-modern = "devcpp.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devcpp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
